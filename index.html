    <!-- Google Tag Manager — carregamento ADIADO (1ª interação ou fallback 3,5s).
         Não baixa nada até o usuário interagir, preservando o render inicial/LCP.
         Listeners passivos + touchstart/pointerdown = seguro no WebKit do iOS.
         Sem requestIdleCallback (não suportado em iOS antigo). -->
    <script>
      (function (w, d) {
        w.dataLayer = w.dataLayer || [];
        var started = false,
          opts = { passive: true, capture: true, once: true },
          evts = ["pointerdown", "touchstart", "mousemove", "keydown", "scroll", "click"];
        function startGTM() {
          if (started) return;
          started = true;
          for (var i = 0; i < evts.length; i++) {
            w.removeEventListener(evts[i], startGTM, opts);
          }
          w.dataLayer.push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
          var s = d.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtm.js?id=GTM-PLDWFDTZ";
          d.head.appendChild(s);
        }
        for (var i = 0; i < evts.length; i++) {
          w.addEventListener(evts[i], startGTM, opts);
        }
        w.setTimeout(startGTM, 3500);
      })(window, document);
    </script>
    <!-- End Google Tag Manager -->
  </head>
